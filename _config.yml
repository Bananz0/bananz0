ai_summary_worker_url: "https://portfolio-spotify-worker.glen-muthoka.workers.dev"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Dot-dirs are skipped by Jekyll unless listed (security.txt, webfinger, atproto-did)
include:
  - .well-known

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - .gitignore
  # CV working tree is private (job-application docs + cover letters).
  # The single public CV is served from assets/cv/glen-muthoka-cv.pdf.
  - cv
  - tools
  # Local-only task list (git-excluded via .git/info/exclude)
  - TODO.md

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"